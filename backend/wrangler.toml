# Cloudflare Worker config for the Excel Heroes backend (free tier: 100k requests/day, D1 5 GB / 5M reads/day).
# 1) npx wrangler login
# 2) npx wrangler d1 create excel-heroes            → paste the database_id below
# 3) npx wrangler d1 execute excel-heroes --remote --file=backend/schema.sql --config backend/wrangler.toml
# 4) fill GOOGLE_CLIENT_ID below (the same Web client ID the game uses in index.html)
# 5) npx wrangler deploy --config backend/wrangler.toml
name = "excel-heroes-api"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Lock CORS to the game's origin once deployed (e.g. "https://excel-heros.qugo.kr"); "*" while testing.
ALLOW_ORIGIN = "https://excel-heros.qugo.kr,http://localhost:8080"
# Google OAuth 2.0 *Web application* client ID from console.cloud.google.com › APIs & Services › Credentials.
# Authorized JavaScript origins must include the game origin (https://excel-heros.qugo.kr) and http://localhost:8080.
GOOGLE_CLIENT_ID = "555871048582-jfcopkcrj6nomp1o5dvd6fm4mkfslai4.apps.googleusercontent.com"

[[d1_databases]]
binding = "DB"
database_name = "excel-heroes"
database_id = "5d201419-6318-4806-8b56-1eee3a0a339a"
