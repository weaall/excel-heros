# Cloudflare Worker config for the Excel Heroes backend (free tier: 100k requests/day, D1 5 GB / 5M reads/day).
# 1) npx wrangler login
# 2) npx wrangler d1 create excel-heroes            → paste the database_id below
# 3) npx wrangler d1 execute excel-heroes --remote --file=backend/schema.sql
# 4) npx wrangler deploy --config backend/wrangler.toml
name = "excel-heroes-api"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Lock CORS to your game's origin once deployed (e.g. "https://weaall.github.io"); "*" while testing.
ALLOW_ORIGIN = "*"

[[d1_databases]]
binding = "DB"
database_name = "excel-heroes"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
